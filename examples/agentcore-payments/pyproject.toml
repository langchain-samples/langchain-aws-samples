[project]
name = "agentcore-payments"
version = "0.1.0"
description = "A LangChain agent that uses AgentCore Payments with LangSmith tracing"
requires-python = ">=3.11"
dependencies = [
    # In 1.18.1 the integrations package imports both framework adapters.
    "bedrock-agentcore[strands-agents]>=1.18.1,<2.0.0",
    "boto3[crt]>=1.43.5,<2.0.0",
    "ipykernel>=6.0.0,<8.0.0",
    "jupyterlab>=4.0.0,<5.0.0",
    "langchain>=1.3.2,<2.0.0",
    "langchain-aws>=1.5.0,<2.0.0",
    "langchain-core>=1.0.0,<2.0.0",
    "langgraph>=1.2.2,<2.0.0",
    "langsmith>=0.8.7,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[tool.uv]
package = false
