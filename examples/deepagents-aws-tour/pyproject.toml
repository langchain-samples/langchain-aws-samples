[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepagents-aws-tour"
version = "0.1.0"
description = "Standalone Deep Agents on AWS workshop tour"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.7",
    "langchain>=1.3.2",
    "langchain-core>=1.0.0",
    "langgraph>=1.2.2",
    "langchain-aws>=1.5.0",
    "langsmith>=0.8.18",
    "langgraph-cli[inmem]>=0.4.27",
    "langgraph-sdk",
    "python-dotenv",
    "boto3[crt]",
    "bedrock-agentcore",
    "playwright",
    "langchain-mcp-adapters",
    "httpx",
    "langchain-agentcore-codeinterpreter>=0.0.4",
    "openevals",
    "agentevals",
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
]

[project.optional-dependencies]
cdk = [
    "aws-cdk-lib>=2.150.0",
    "constructs>=10,<11",
    "cdklabs.generative-ai-cdk-constructs>=0.1.0",
]

[tool.uv]
package = false

[tool.setuptools]
# Flat layout: list the runtime modules explicitly so the editable install used
# by `langgraph build`/`deploy` (`uv pip install -e .`) does not fail setuptools
# auto-discovery with "Multiple top-level modules discovered in a flat-layout".
# Intentionally excludes build_tour.py and cdk_preprovision.py, which are not
# imported by the deployed graph at runtime.
py-modules = ["graph", "store", "tools", "mcp_client"]
