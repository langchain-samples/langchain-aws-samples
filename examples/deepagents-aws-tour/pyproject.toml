[project]
name = "deepagents-aws-tour"
version = "0.1.0"
description = "Standalone Deep Agents on AWS workshop tour"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.7",
    "langchain>=1.3.2",
    "langchain-core>=1.0.0",
    "langgraph>=1.2.2",
    "langchain-aws>=1.5.0",
    "langsmith>=0.8.7",
    "langgraph-cli[inmem]>=0.4.27",
    "langgraph-sdk",
    "python-dotenv",
    "boto3",
    "bedrock-agentcore",
    "langchain-agentcore-codeinterpreter>=0.0.4",
    "openevals",
    "agentevals",
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
]

[project.optional-dependencies]
cdk = [
    "aws-cdk-lib>=2.150.0",
    "constructs>=10,<11",
    "cdklabs.generative-ai-cdk-constructs>=0.1.0",
]

[tool.uv]
package = false
